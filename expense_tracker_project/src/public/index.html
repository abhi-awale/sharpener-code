<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Expense Tracker</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-4">

<h2 class="text-center mb-4">Expense Tracker Dashboard</h2>

<!-- AUTH SECTION -->

<div id="authSection">

<ul class="nav nav-tabs mb-3">
<li class="nav-item">
<button class="nav-link active" data-bs-toggle="tab" data-bs-target="#loginTab">Login</button>
</li>
<li class="nav-item">
<button class="nav-link" data-bs-toggle="tab" data-bs-target="#registerTab">Register</button>
</li>
</ul>

<div class="tab-content">

<!-- LOGIN -->

<div class="tab-pane fade show active" id="loginTab">

<input id="loginEmail" class="form-control mb-2" placeholder="Email">
<input id="loginPassword" type="password" class="form-control mb-2" placeholder="Password">

<button class="btn btn-success w-100" onclick="login()">Login</button>

</div>

<!-- REGISTER -->

<div class="tab-pane fade" id="registerTab">

<input id="regName" class="form-control mb-2" placeholder="Name">
<input id="regEmail" class="form-control mb-2" placeholder="Email">
<input id="regPassword" type="password" class="form-control mb-2" placeholder="Password">

<button class="btn btn-primary w-100" onclick="register()">Register</button>

</div>

</div>

</div>

<!-- DASHBOARD -->

<div id="dashboard" style="display:none">

<div class="d-flex justify-content-between mb-3">

<h4>Dashboard</h4>

<button class="btn btn-danger" onclick="logout()">Logout</button>

</div>

<!-- CATEGORY -->

<div class="card mb-3">
<div class="card-body">

<h5>Create Category</h5>

<div class="row">
<div class="col">
<input id="categoryName" class="form-control" placeholder="Category name">
</div>
<div class="col-auto">
<button class="btn btn-warning" onclick="createCategory()">Add</button>
</div>
</div>

</div>
</div>

<!-- ADD EXPENSE -->

<div class="card mb-3">
<div class="card-body">

<h5>Add Expense</h5>

<div class="row g-2">

<div class="col-md-3">
<input id="amount" class="form-control" placeholder="Amount">
</div>

<div class="col-md-3">
<select id="categorySelect" class="form-select"></select>
</div>

<div class="col-md-3">
<select id="paymentMethod" class="form-select">
<option value="cash">Cash</option>
<option value="upi">UPI</option>
<option value="card">Card</option>
<option value="netbanking">Netbanking</option>
</select>
</div>

<div class="col-md-3">
<input id="description" class="form-control" placeholder="Description">
</div>

</div>

<button class="btn btn-primary mt-2" onclick="createExpense()">Add Expense</button>

</div>
</div>

<!-- EXPENSE TABLE -->

<div class="card">
<div class="card-body">

<h5>Expenses</h5>

<button class="btn btn-info mb-2" onclick="loadExpenses()">Refresh</button>

<table class="table table-striped">

<thead>
<tr>
<th>ID</th>
<th>Amount</th>
<th>Category</th>
<th>Description</th>
<th>Action</th>
</tr>
</thead>

<tbody id="expenseTable"></tbody>

</table>

</div>
</div>

</div>

</div>

<script src="script.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
