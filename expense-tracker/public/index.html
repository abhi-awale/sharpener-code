<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Expense Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-9">

                <div class="card shadow">

                    <div class="card-header bg-primary text-white text-center">
                        <h3>Expense Tracker</h3>
                    </div>

                    <div class="card-body">

                        <form id="expenseForm" class="row g-3 mb-4">

                            <input type="hidden" id="editId">

                            <div class="col-md-4">
                                <input type="text" id="title" class="form-control" placeholder="Expense Title" required>
                            </div>

                            <div class="col-md-3">
                                <input type="number" id="amount" class="form-control" placeholder="Amount" required>
                            </div>

                            <div class="col-md-3">
                                <input type="date" id="date" class="form-control" required>
                            </div>

                            <div class="col-md-2 d-grid">
                                <button type="submit" class="btn btn-success" id="submitBtn">Add</button>
                            </div>

                        </form>

                        <table class="table table-bordered table-striped">

                            <thead class="table-dark">
                                <tr>
                                    <th>Title</th>
                                    <th>Amount</th>
                                    <th>Date</th>
                                    <th width="160">Action</th>
                                </tr>
                            </thead>

                            <tbody id="expenseList"></tbody>

                        </table>

                    </div>
                </div>

            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <script src="index.js"></script>

</body>

</html>
