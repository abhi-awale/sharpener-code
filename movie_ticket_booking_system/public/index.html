<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie ticket manager</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <div class="header">
        <h1 class="main-heading">Movie ticket booking</h1>
        <h3 id="totalBooking">Total Booking : 0 </h3>

        <div class="sub-heading">
            <label for="searchSlot"> Find Slot :</label>
            <input type="text" id="searchSlot" name="searchSlot" />
        </div>
    </div>

    <div class="form-div">
        <form class="booking-form">
            <div>
                <label for="name">Name: </label>
                <input type="text" id="name" name="name" placeholder="Enter your name" />
            </div>
            <div>
                <label for="seatNo">Seat No: </label>
                <input type="number" id="seatNo" name="seatNo" placeholder="Enter seat number" />
            </div>
            <button type="submit" class="submit-btn">Submit</button>
        </form>

        <ul class="booking-list">
        </ul>
    </div>

    <p id = "successPopup" class="popup"></p>

</body>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="index.js"></script>

</html>
